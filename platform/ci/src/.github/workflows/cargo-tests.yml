# ─────────────────────────────────────────────────────────────────────────────
# cargo-tests.yml — the unit tests of OUR Rust code in WebRender (gfx/wr), on a GitHub runner, never on the Latitude node.
#
# Our Rust sits in a few Mozilla files, with #[cfg(test)] modules of our own: the shared fonts a namespace leaves behind when its window is gone
# (webrender/src/render_backend/stealth_shared_fonts.rs, mod tests). The gtests are the C++ ones and no other round ran these. Only ours run: libtest's filters
# by module name, never the whole of WebRender's tests (a cold build of those is another job). scripts/ci/cargo_oracles.py is the verdict: red unless every
# module of ours reported its floor of tests, all ok (a filter that matches nothing is a green for cargo).
#
# THE TREE: the same as every job that reads it, `tools/engine.py materialize` (the Mozilla tag + the series, the tree checked against UPSTREAM.json),
# but into a repository whose sparse checkout is set first: only gfx/wr, scripts and browser/config are written to disk, not the 300,000 files of
# Firefox. The fetch of the tag is the whole of it, as in `checks`.
# THE RUST: the retail's release for this tree (scripts/upstream_toolchain.py), as the build's, never the runner's.
# THE CRATES: crates.io (Cargo's registry, with the sparse index) and github.com for the one git crate of gfx/wr/Cargo.toml's [patch], at the versions
# of gfx/wr/Cargo.lock. The vendored crates of third_party/rust belong to Gecko's own lock and are not in the sparse tree; nothing else is fetched.
# THE SECOND RUN: mdns_service (dom/media/webrtc/transport/mdns_service) is not in gfx/wr's workspace and is no member of anything on the runner: its own
# `cargo test --lib`, in its directory, for the module of ours in it (src/stealth_tests.rs, `mod stealth_tests`, one test: the responder on the loopback hears its own query, real UDP sockets on
# the loopback, 3 seconds at most). The crate builds outside Gecko: its dependencies (byteorder, dns-parser, log, socket2, uuid) are all on crates.io, at the
# versions of the root Cargo.lock (copied beside it; cargo drops what the crate does not use). The runner's copy of its manifest is made standalone: an empty
# [workspace] table (it is its own root), and the optional gecko-profiler (a path crate of Gecko, feature `profiler`, never built here) is dropped. Its log is
# appended to the same file as WebRender's, so one verdict reads both. Mozilla's other tests of the crate (they bind port 5353 too) do not run: the filter is our module.
# A tree without the test has `0 passed` and the verdict is red: the job is for the tree where hooks/fingerprint__webrtc__declared-network is merged.
# THE THIRD RUN: glean-core (third_party/rust/glean-core, a vendored crate, not a member of anything on the runner) is the test of upstream's that the backport
# platform/backports/glean-init-shutdown-race carries (mozilla/glean PR 3727, bug 2072668: dispatcher::test::flush_init_runs_final_task_after_full_preinit_buffer, in
# src/dispatcher/mod.rs). Its own `cargo test --lib`, in its directory, standalone like mdns_service: an empty [workspace] table, and the dev-dependencies the lib tests
# never read dropped (criterion, pulldown-cmark, pulldown-cmark-to-cmark, xshell, yaml-rust2: for its benches and its tests/ directory; env_logger, tempfile and ctor stay, the lib
# tests use them). The crate's own Cargo.lock (every source is crates.io) is the lock. Its log is appended to the same file. The filter is the one test by its full path: the tree without
# the backport has no such test, cargo says `0 passed` and the verdict is red (the floor of scripts/ci/cargo_oracles.py), with the backport it runs and is green.
# THE DEV-DEPENDENCIES the tests never use are dropped from the runner's copy of two manifests: mozangle (builds ANGLE's C++, for webrender/tests/
# angle_shader_validation.rs) and glutin/winit (the examples of wr_glyph_rasterizer). Cargo builds every dev-dependency for any test target, `--lib`
# included, and none of ours reads them.
# THE CACHE: none. A cache of target/ is a gigabyte per entry, and the compile cache of release.yml is what the repository's quota is for.
# THE BUDGET: 15 minutes a leg (the job's timeout). The measured time of each step is in the run's summary.
# Called by gate.yml (so it runs beside the rest of the gate) and on a push to latitude/*-oracles, for a run of its own.
# ─────────────────────────────────────────────────────────────────────────────
name: cargo-tests

on:
  workflow_call:
    inputs:
      series_ref:
        description: the commit of the series (this repository) the tree is made from; empty, the caller's commit
        type: string
        default: ''
  push:
    branches: ['latitude/*-oracles']
    paths-ignore: ['**.md']

permissions: { contents: read }

# A newer push to the branch replaces the older run; a called run, or any other event, has a group of its own.
concurrency:
  group: cargo-tests-${{ github.event_name == 'push' && github.workflow == 'cargo-tests' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.workflow == 'cargo-tests' }}

jobs:
  cargo-tests:
    name: cargo-tests-${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    # measured: max 12m22s over 24 runs (45025164169..45423466521) before the third run (win-x86_64, the slower leg; the one cancel, 45423466521, had
    # every step done at 14m53s: a compile at 6m03 against 2m33-3m56, on top of the tree's 6 minutes that build_stack's batching removes). The glean-core run is the
    # third run of the job: measured once, run 45718525016 (latitude/port-06-r4-oracles): win-x86_64 job 9m41s (the glean-core step 123 s), linux-x86_64 job 6m02s (73 s).
    # Worst case estimated as the old max plus the glean-core step: 12m22s + 2m03s = about 14.5 minutes; plus 25% = 18 minutes. One run is not a distribution:
    # when three runs of this job have the third run, set the budget again to the largest measured time plus 25%.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: linux-x86_64, runner: ubuntu-24.04 }
          - { leg: win-x86_64, runner: windows-latest }
    env:
      # TEMP and TMP on D:\a\_temp on Windows (scripts/ci/test_gate_windows_temp.py); /tmp is what Linux uses anyway.
      TEMP: ${{ startsWith(matrix.runner, 'windows') && 'D:\a\_temp' || '/tmp' }}
      TMP: ${{ startsWith(matrix.runner, 'windows') && 'D:\a\_temp' || '/tmp' }}
      # Git Bash on Windows rewrites an argument that starts with a slash into a path: the sparse patterns below start with one.
      MSYS_NO_PATHCONV: '1'
      # A cold build, once: no incremental state, no debug info (compiling and linking both faster), no colours in the log the verdict reads.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      CARGO_NET_RETRY: '10'
    defaults:
      run:
        shell: bash
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1, ref: '${{ inputs.series_ref }}' }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: The source tree, sparse (the Mozilla tag with our series applied, only gfx/wr, scripts and browser/config on disk)
        run: |
          set -e
          date +%s > .t0
          git config --global core.longpaths true
          git init -q .
          git sparse-checkout set --no-cone '/gfx/wr/' '/scripts/' '/browser/config/' '/Cargo.lock' '/dom/media/webrtc/transport/mdns_service/' '/third_party/rust/glean-core/'
          python .series/tools/engine.py materialize --into .
          test -f gfx/wr/Cargo.lock
          echo "tree: $(( $(date +%s) - $(cat .t0) )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rust, the retail's release for this tree
        run: |
          set -e
          RUST="$(python scripts/upstream_toolchain.py --leg ${{ matrix.leg }} rust-version)"
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
          rustc --version
          cargo --version
      - name: Drop the dev-dependencies the tests never read (ANGLE's C++ and the windowing crates of the examples)
        working-directory: gfx/wr
        run: |
          set -e
          sed -i '/^mozangle = /d' webrender/Cargo.toml
          sed -i '/^glutin = /d;/^glutin-winit = /d;/^winit = /d' wr_glyph_rasterizer/Cargo.toml
          if grep -n '^mozangle = \|^glutin\|^winit' webrender/Cargo.toml wr_glyph_rasterizer/Cargo.toml; then
            echo "ERROR: a dev-dependency is still there"; exit 1
          fi
      # Only the modules of ours (scripts/ci/cargo_oracles.py: FILTERS). The log is the verdict's input; cargo's own exit code is this step's.
      - name: The unit tests of our Rust in WebRender (webrender lib tests, our module stealth_shared_fonts only)
        id: cargo
        working-directory: gfx/wr
        run: |
          set -o pipefail
          date +%s > ../../.t1
          cargo test -p webrender --lib -- render_backend::stealth_shared_fonts::tests 2>&1 | tee cargo-test.log
      # The crate of the responder, standalone (see THE SECOND RUN). Runs even when WebRender's run was red, so the one log has both; its own exit code is this step's.
      - name: The test of ours in mdns_service (its own cargo run, the responder on the loopback)
        id: cargo-mdns
        if: ${{ !cancelled() }}
        working-directory: dom/media/webrtc/transport/mdns_service
        run: |
          set -eo pipefail
          cp ../../../../../Cargo.lock Cargo.lock
          echo >> Cargo.toml
          echo '[workspace]' >> Cargo.toml
          sed -i '/^gecko-profiler = /d;/^profiler = /d' Cargo.toml
          if grep -n 'gecko-profiler\|^profiler' Cargo.toml; then
            echo "ERROR: the profiler crate is still in the manifest"; exit 1
          fi
          date +%s > ../../../../../.t2
          cargo test --lib -- stealth_tests:: 2>&1 | tee -a ../../../../../gfx/wr/cargo-test.log
      # The crate of the backport, standalone (see THE THIRD RUN). Runs even when the runs before were red, so the one log has all three; its own exit code is this step's.
      - name: The test of the glean-core backport (its own cargo run, the final task of the dispatcher after a full pre-init buffer)
        id: cargo-glean
        if: ${{ !cancelled() }}
        working-directory: third_party/rust/glean-core
        run: |
          set -eo pipefail
          # LF only: a checkout that wrote CRLF would keep the `$` of the ranges below from matching
          sed -i 's/\r$//' Cargo.toml
          echo >> Cargo.toml
          echo '[workspace]' >> Cargo.toml
          for dep in criterion pulldown-cmark pulldown-cmark-to-cmark xshell yaml-rust2; do
            sed -i "/^\[dev-dependencies\.$dep\]\$/,/^\$/d" Cargo.toml
          done
          if grep -n 'dev-dependencies.criterion\|dev-dependencies.pulldown\|dev-dependencies.xshell\|dev-dependencies.yaml-rust2' Cargo.toml; then
            echo "ERROR: a dev-dependency is still in the manifest"; exit 1
          fi
          date +%s > ../../../.t3
          cargo test --lib -- dispatcher::test::flush_init_runs_final_task_after_full_preinit_buffer 2>&1 | tee -a ../../../gfx/wr/cargo-test.log
      # THE JUNIT for the named hook tests judge (hook-tests-judge.yml reads the artifact `junit-cargo`): one file per test binary, a testcase per test named
      # as cargo prints it, written from the log above (scripts/ci/cargo_junit.py, libtest's text: no nightly flag). It runs whatever cargo said, and its own
      # failure (a log with no test binary in it: the tests did not run) is a red of the leg; the upload below runs whatever this step said.
      - name: The junit of the cargo tests (one file per test binary)
        if: always()
        run: python scripts/ci/cargo_junit.py gfx/wr/cargo-test.log --out junit-cargo/${{ matrix.leg }} --packages webrender,mdns_service,glean-core
      - name: Keep the junit (this leg's part of junit-cargo)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junitpart-cargo-${{ matrix.leg }}
          path: junit-cargo
          if-no-files-found: ignore
          retention-days: 14
      - name: Verdict - the tests of ours ran, every one passed, none below its floor
        if: always()
        run: |
          if [ -f .t1 ]; then echo "cargo test: $(( $(date +%s) - $(cat .t1) )) s" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ -f .t2 ]; then echo "cargo test mdns_service: $(( $(date +%s) - $(cat .t2) )) s" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ -f .t3 ]; then echo "cargo test glean-core: $(( $(date +%s) - $(cat .t3) )) s" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          [ -f gfx/wr/cargo-test.log ] || { echo "RED: cargo wrote no log"; exit 1; }
          python scripts/ci/cargo_oracles.py verdict gfx/wr/cargo-test.log | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-tests-${{ matrix.leg }}
          path: gfx/wr/cargo-test.log
          if-no-files-found: ignore
          retention-days: 14

  # THE ARTIFACT `junit-cargo`, one for the run (an artifact name is one per run, and the two legs cannot both write it): the legs' parts, put together as
  # junit-cargo/<leg>/<binary>.xml. The judge reads `junit-*` folders by their name, so a part is named `junitpart-*`, which it does not read. This job
  # reads and uploads only: its steps do not fail it, so the verdict of the workflow stays the legs'.
  junit:
    name: junit-cargo
    needs: cargo-tests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both legs' junit
        # continue-on-error: an optional download (a leg that never got to upload its part leaves none); the judge is red for a named test with no junit
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: junitpart-cargo-*
          path: junit-cargo
          merge-multiple: true
      - name: Keep junit-cargo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-cargo
          path: junit-cargo
          if-no-files-found: ignore
          retention-days: 14
