# ─────────────────────────────────────────────────────────────────────────────
# verify-assets.yml — re-runnable DRIVE GATE for an EXISTING release's assets.
#
# release.yml drive-gates every binary it builds. This does the same drive test
# WITHOUT rebuilding: it downloads a release's already-published assets (works on
# DRAFT releases too via GITHUB_TOKEN) and drives each one on its native runner.
#
# Use it to:
#   • drive-test a release that was built before the in-pipeline gate existed
#     (e.g. firefox-9, built on the old release.yml), or
#   • re-verify any shipped release on demand (regression check).
#
# Same single-source-of-truth drive logic as release.yml: scripts/ci_drive_gate.py.
# Headless, no screenshot → GPU-free. Zero proxy / zero secrets.
#
# NO LEG READS A MIRROR (ci-03): the Python packages come from the wheelhouse of the job `py-deps-assets` (py-deps.yml, from the wrapper's gate lock
# ci/py-lock/gate.txt at main: every file hash-checked) and are installed offline; the Ubuntu packages of Firefox's runtime come from the job `linux-deps-assets`
# (linux-deps.yml: the roots of `playwright install-deps firefox`, read from the locked Playwright's table), installed by name with --no-download.
# ─────────────────────────────────────────────────────────────────────────────
name: verify-assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'release tag whose assets to drive-test (e.g. firefox-9)'
        required: true

permissions:
  # write (not read) is required: GitHub only exposes DRAFT releases to tokens
  # with push access. With contents:read, `gh release download` on a draft tag
  # 404s ("release not found"). This workflow only READS assets — the elevated
  # scope is solely to make draft releases visible to GITHUB_TOKEN.
  contents: write

jobs:
  # The wrapper checked out below is main's, so the lock is main's too.
  py-deps-assets:
    name: py-deps-assets
    permissions: { contents: read }
    uses: ./.github/workflows/py-deps.yml
    with:
      name: assets
      python: "3.11"
      lock_repository: oss-invisible/playwright
      lock_ref: main
      lock: ci/py-lock/gate.txt
      runners: '["ubuntu-24.04", "windows-latest"]'
  linux-deps-assets:
    name: linux-deps-assets
    permissions: { contents: read }
    uses: ./.github/workflows/linux-deps.yml
    with:
      name: assets
      playwright_wrapper_ref: main

  drive:
    name: drive-${{ matrix.leg }}
    needs: [py-deps-assets, linux-deps-assets]
    runs-on: ${{ matrix.runner }}
    # TEMP and TMP on D:\a\_temp (the runner's temp folder): the Firefox profiles land in TEMP and on C: they saturate the disk (queue up to 144,
    # latencies up to 4 s, parent main thread still 40-60 s). On the job, not in a step: `runner.temp` is not readable in a job's `env`.
    env:
      TEMP: ${{ startsWith(matrix.runner, 'windows') && 'D:\a\_temp' || '/tmp' }}
      TMP: ${{ startsWith(matrix.runner, 'windows') && 'D:\a\_temp' || '/tmp' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two macOS legs were removed on 2026-08-26 (end of all support,
          # owner's decision). They also named macos-15 /
          # macos-15-intel, images already dropped at firefox-19: stale twice
          # over. The mac stays READABLE where history needs it - make_seal.py
          # keeps darwin in ENTRY_REL and NAME_RE on purpose, because tags up to
          # firefox-20 had the mac - but here it is no longer required.
          # --full (interaction) only on the reliable linux-x86_64 leg; others run
          # the robust SMOKE drive. Same rationale as release.yml's gate.
          - leg: linux-x86_64
            runner: ubuntu-24.04
            kind: linux
            extra: '--full'
          - leg: win-x86_64
            runner: windows-latest
            kind: win
            extra: ''
    steps:
      - name: Checkout wrapper (for scripts/ci_drive_gate.py)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: main
          fetch-depth: 1
      - name: Download the release asset (draft releases included)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -e
          mkdir -p art
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "firefox-*-stealth-${{ matrix.leg }}.*" \
            --dir art
          ls -la art/
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: The wheelhouse of the run's py-deps-assets job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: py-deps-assets-${{ matrix.kind == 'win' && 'windows' || 'linux' }}
          path: ${{ runner.temp }}/py-deps
      - name: Install Playwright driver (no bundled browser — we override executable_path), from the wheelhouse alone (no index)
        # Single-source pin (scripts/playwright_pin.txt, which the lock follows); the drive gate enforces juggler compat.
        shell: bash
        run: python -m pip install --quiet --no-index --find-links "$RUNNER_TEMP/py-deps" --require-hashes -r "$RUNNER_TEMP/py-deps/lock.txt"
      - name: The Linux packages (the run's linux-deps-assets job, no mirror)
        if: matrix.kind == 'linux'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.linux-deps-assets.outputs.artifact }}
          path: /tmp/linux-deps
      - name: Linux system deps for headless firefox
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # The run's linux-deps repository and nothing else: apt reads only its sources list and lists folder, the files are already in apt's archives,
          # and the roots are installed by name with --no-download: a package the repository does not hold is named here and red, never fetched.
          read -r OS VER < /tmp/linux-deps/image.txt
          echo "the repository was read on $OS $VER; this runner is $ImageOS $ImageVersion"
          sudo mkdir -p /tmp/linux-deps-apt/lists/partial /tmp/linux-deps-apt/parts
          echo "deb [trusted=yes] file:/tmp/linux-deps ./" | sudo tee /tmp/linux-deps-apt/sources.list >/dev/null
          APT="-o Dir::Etc::SourceList=/tmp/linux-deps-apt/sources.list -o Dir::Etc::SourceParts=/tmp/linux-deps-apt/parts -o Dir::State::Lists=/tmp/linux-deps-apt/lists -o Acquire::Languages=none"
          sudo apt-get $APT update
          sudo cp /tmp/linux-deps/*.deb /var/cache/apt/archives/
          sudo apt-get $APT install -y --no-download --no-install-recommends $(cat /tmp/linux-deps/roots.txt)
      - name: Extract + locate firefox binary
        shell: bash
        run: |
          set -e
          mkdir -p ff
          # The one archive of this leg, whatever version it carries: the name is
          # derived from the tree at build time (scripts/ci/legs.py), not here.
          set -- art/firefox-*-stealth-${{ matrix.leg }}.*
          [ "$#" -eq 1 ] && [ -e "$1" ] || { echo "ERROR: expected one firefox-*-stealth-${{ matrix.leg }} archive in art/, found: $*"; exit 1; }
          A="$1"
          case "${{ matrix.kind }}" in
            win)   python -c "import zipfile; zipfile.ZipFile('$A').extractall('ff')"; EXE="ff/firefox.exe";;
            linux) tar xzf "$A" -C ff; EXE="ff/firefox";;
          esac
          [ -e "$EXE" ] || { echo "ERROR: firefox binary not found at $EXE"; exit 1; }
          chmod +x "$EXE" 2>/dev/null || true
          echo "FF_EXE=$EXE" >> "$GITHUB_ENV"
          echo "located: $EXE"
      - name: DRIVE GATE — Playwright launch via juggler + real page (+ interaction on --full)
        shell: bash
        run: python scripts/ci_drive_gate.py "$FF_EXE" ${{ matrix.extra }}
