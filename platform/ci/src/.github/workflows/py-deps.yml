# ─────────────────────────────────────────────────────────────────────────────
# py-deps.yml — the Python packages of a workflow's jobs, read from the index ONCE per runner image, Python and lock, never by the jobs (ci-03).
#
# THE RULE: a list of packages is resolved against the exact state it is installed on, once per state, by one job; the result is kept in a cache
# keyed by that state and the list; the legs install only from it, offline, by name; no unpinned install anywhere. The same shape as linux-deps.yml
# (Ubuntu's packages), for pip.
#
# THE LIST is a LOCK: a pip requirements file with an exact version and a sha256 for every file of that version on the index (every platform, every
# Python from its floor), made by scripts/ci/py_deps.py `lock` (uv pip compile --universal --generate-hashes). The series' locks live in
# scripts/ci/locks/ (tools, core-checks, lavapipe, mach, wheel-build): workflows run in the series repository, where this tree's scripts live under
# platform/ci/src/, so the resolver is read from platform/ci/src/scripts/ci/py_deps.py and a series-owned `lock` input is relative to platform/ci/src/ (callers pass
# scripts/ci/locks/<name>.txt); the lock of a wrapper-selected environment (`gate`) lives in the wrapper and is read at the
# wrapper_ref the run selects: lock_repository + lock_ref + lock. A lock that names a version the index does not hold, a file with another hash or a
# package with no wheel for the runner's platform is red HERE, by name, never in a leg.
#
# THE STATE is the runner image's OS (ImageOS), the release of its image (the first number of ImageVersion: GitHub mixes builds of one release in a run,
# so a key per build would miss run after run, linux-deps.yml), the Python's minor, and the sha of a spec: the lock's sha256, the exact `python -VV`, the
# commits whose wheels are built (core_ref, wrapper_ref), this resolver's own sha and the lock of the build backend. ImageOS and ImageVersion are the
# variables the hosted images set (linux-deps.yml reads them on Ubuntu); a step that finds either missing fails with that message, so a first run on a
# hosted Windows image settles it.
#
# THE WHEELHOUSE (cache entry, and artifact py-deps-<name>-<os>, os = linux or windows: one call lists each OS once): every file the lock names for the
# runner's platform (pip download --only-binary=:all: --require-hashes), the wheels of OUR packages built from core_ref and wrapper_ref (pip wheel
# --no-deps, with the build backend installed from scripts/ci/locks/wheel-build.txt, --no-build-isolation: no unpinned read even to build), lock.txt,
# refs.json (the wheels, their sha256 and the commits they were built from), spec.txt, image.txt. On a miss, and only then, the resolver also proves the
# house installable offline: the lock alone, then each wheel of ours with its extras (`pip install --dry-run --no-index`), so a dependency a ref declares that the lock
# does not cover is named by pip here. Every step that reaches the index carries `if: steps.restore.outputs.cache-hit != 'true'`.
#
# A CONSUMER (a job that `needs:` the call): download the artifact, install from it, offline, by name:
#
#     - uses: actions/download-artifact@<pin>
#       with: { name: py-deps-<name>-<os>, path: ${{ runner.temp }}/py-deps }
#     - run: |
#         python -m pip install --no-index --find-links "$RUNNER_TEMP/py-deps" --require-hashes -r "$RUNNER_TEMP/py-deps/lock.txt"
#         python -m pip install --no-index --no-deps --find-links "$RUNNER_TEMP/py-deps" invisible_core invisible_playwright   # ours, by name
#
# or the same as one command: python scripts/ci/py_deps.py install --house "$RUNNER_TEMP/py-deps" (it also checks each wheel of ours against refs.json
# and runs `pip check`). Neither reaches the index: --no-index, and the wheels are there.
# ─────────────────────────────────────────────────────────────────────────────
name: py-deps

on:
  workflow_call:
    inputs:
      name:
        description: the artifact is py-deps-<name>-<os>
        type: string
        required: true
      python:
        description: the Python the packages are for (3.11, 3.12); the exact `python -VV` is part of the key
        type: string
        required: true
      lock:
        description: 'path of the lock: with lock_repository, from that repository''s root (e.g. ci/py-lock/gate.txt); without, a series-owned lock, from platform/ci/src/ of this repository (e.g. scripts/ci/locks/tools.txt)'
        type: string
        required: true
      lock_repository:
        description: the repository the lock lives in, when it is not this one (e.g. oss-invisible/playwright); empty for this repository
        type: string
        default: ''
      lock_ref:
        description: the ref of lock_repository to read the lock at (the wrapper_ref the run selects); empty for this repository's commit
        type: string
        default: ''
      core_ref:
        description: oss-invisible/core ref whose wheel is built (pip wheel --no-deps); empty for none
        type: string
        default: ''
      core_extras:
        description: extras of the core wheel the lock must satisfy (e.g. dev), proven offline on a miss
        type: string
        default: ''
      wrapper_ref:
        description: oss-invisible/playwright ref whose wheel is built (pip wheel --no-deps); empty for none
        type: string
        default: ''
      wrapper_extras:
        description: extras of the wrapper wheel the lock must satisfy (e.g. dev), proven offline on a miss
        type: string
        default: ''
      runners:
        description: JSON list of the runner labels that need a wheelhouse, one job each, at most one per OS (ubuntu-24.04, windows-latest, windows-2022)
        type: string
        default: '["ubuntu-24.04"]'
    outputs:
      artifact_prefix:
        description: the artifacts are <this>-linux and <this>-windows
        value: py-deps-${{ inputs.name }}

permissions: { contents: read }

jobs:
  wheels:
    name: wheels (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # TEMP and TMP on D:\a\_temp (the runner's temp folder) on Windows, as the other Windows jobs (test_gate_windows_temp.py): pip builds and unpacks there.
    env:
      TEMP: ${{ startsWith(matrix.runner, 'windows') && 'D:\a\_temp' || '/tmp' }}
      TMP: ${{ startsWith(matrix.runner, 'windows') && 'D:\a\_temp' || '/tmp' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    steps:
      - name: Checkout the resolver and the series' locks
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: py-deps-tools
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            platform/ci/src/scripts/ci/py_deps.py
            platform/ci/src/scripts/ci/locks
          sparse-checkout-cone-mode: false
      - name: Checkout the lock (another repository, at its ref)
        if: inputs.lock_repository != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ inputs.lock_repository }}
          ref: ${{ inputs.lock_ref }}
          path: py-deps-lock
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: ${{ inputs.lock }}
          sparse-checkout-cone-mode: false
      - name: Checkout the core (its wheel is built)
        if: inputs.core_ref != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/core
          ref: ${{ inputs.core_ref }}
          path: py-deps-src/core
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the wrapper (its wheel is built)
        if: inputs.wrapper_ref != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: ${{ inputs.wrapper_ref }}
          path: py-deps-src/wrapper
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '${{ inputs.python }}' }
      - name: The state and its entry (the runner image, the Python, the lock and the refs)
        id: spec
        shell: bash
        env:
          PYTHON_WANTED: ${{ inputs.python }}
          LOCK_REPOSITORY: ${{ inputs.lock_repository }}
          LOCK: ${{ inputs.lock }}
          CORE_REF: ${{ inputs.core_ref }}
          CORE_EXTRAS: ${{ inputs.core_extras }}
          WRAPPER_REF: ${{ inputs.wrapper_ref }}
          WRAPPER_EXTRAS: ${{ inputs.wrapper_extras }}
        run: |
          set -euo pipefail
          : "${ImageOS:?no ImageOS: not a GitHub runner image}" "${ImageVersion:?no ImageVersion: not a GitHub runner image}"
          python - "$PYTHON_WANTED" <<'PY'
          import sys
          have = "%d.%d" % sys.version_info[:2]
          sys.exit(0 if have == sys.argv[1] else "the Python is %s, the call asked for %s" % (have, sys.argv[1]))
          PY
          PYMINOR="$(python -c 'import sys; print("%d%d" % sys.version_info[:2])')"
          if [ -n "$LOCK_REPOSITORY" ]; then LOCK_FILE="py-deps-lock/$LOCK"; else LOCK_FILE="py-deps-tools/platform/ci/src/$LOCK"; fi
          [ -s "$LOCK_FILE" ] || { echo "ERROR: no lock $LOCK in ${LOCK_REPOSITORY:-this repository}"; exit 1; }
          CORE_SHA=""; WRAPPER_SHA=""
          if [ -n "$CORE_REF" ]; then CORE_SHA="$(git -C py-deps-src/core rev-parse HEAD)"; fi
          if [ -n "$WRAPPER_REF" ]; then WRAPPER_SHA="$(git -C py-deps-src/wrapper rev-parse HEAD)"; fi
          SPEC="$RUNNER_TEMP/py-deps-spec.txt"
          python py-deps-tools/platform/ci/src/scripts/ci/py_deps.py spec --lock "$LOCK_FILE" --core "$CORE_SHA" --wrapper "$WRAPPER_SHA" \
            --core-extras "$CORE_EXTRAS" --wrapper-extras "$WRAPPER_EXTRAS" --out "$SPEC"
          cat "$SPEC"
          SHA="$(sha256sum < "$SPEC" | cut -c1-16)"
          RELEASE="${ImageVersion%%.*}"
          OS="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          { echo "lock=$LOCK_FILE"; echo "spec=$SPEC"; echo "os=$OS"; echo "core_sha=$CORE_SHA"; echo "wrapper_sha=$WRAPPER_SHA"; } >> "$GITHUB_OUTPUT"
          echo "key=py-deps-$ImageOS-$RELEASE-py$PYMINOR-$SHA" | tee -a "$GITHUB_OUTPUT"
      - name: The entry of this image, Python and lock
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/py-deps-house
          key: ${{ steps.spec.outputs.key }}
      - name: A new image, Python, lock or ref - the wheelhouse from the index, once
        if: steps.restore.outputs.cache-hit != 'true'
        shell: bash
        env:
          LOCK_FILE: ${{ steps.spec.outputs.lock }}
          SPEC: ${{ steps.spec.outputs.spec }}
          CORE_REF: ${{ inputs.core_ref }}
          CORE_EXTRAS: ${{ inputs.core_extras }}
          WRAPPER_REF: ${{ inputs.wrapper_ref }}
          WRAPPER_EXTRAS: ${{ inputs.wrapper_extras }}
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          HOUSE="$RUNNER_TEMP/py-deps-house"
          rm -rf "$HOUSE"
          ARGS=()
          if [ -n "$CORE_REF" ]; then ARGS+=(--core py-deps-src/core --core-extras "$CORE_EXTRAS"); fi
          if [ -n "$WRAPPER_REF" ]; then ARGS+=(--wrapper py-deps-src/wrapper --wrapper-extras "$WRAPPER_EXTRAS"); fi
          python py-deps-tools/platform/ci/src/scripts/ci/py_deps.py build --lock "$LOCK_FILE" --house "$HOUSE" "${ARGS[@]}"
          cp "$SPEC" "$HOUSE/spec.txt"
          echo "$ImageOS $ImageVersion" > "$HOUSE/image.txt"
          echo "$(find "$HOUSE" -name '*.whl' | wc -l) wheels, $(du -sh "$HOUSE" | cut -f1)"
      - name: Keep the entry
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/py-deps-house
          key: ${{ steps.spec.outputs.key }}
      - name: The wheelhouse is the lock's (a hit or a build)
        shell: bash
        env:
          LOCK_FILE: ${{ steps.spec.outputs.lock }}
        run: |
          set -euo pipefail
          HOUSE="$RUNNER_TEMP/py-deps-house"
          cmp "$LOCK_FILE" "$HOUSE/lock.txt" || { echo "ERROR: the entry's lock is not $LOCK_FILE"; exit 1; }
          [ -s "$HOUSE/spec.txt" ] && cmp "$RUNNER_TEMP/py-deps-spec.txt" "$HOUSE/spec.txt" || { echo "ERROR: the entry's spec is not this run's"; exit 1; }
      - name: The wheelhouse for the jobs of this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: py-deps-${{ inputs.name }}-${{ steps.spec.outputs.os }}
          path: ${{ runner.temp }}/py-deps-house
          retention-days: 1
          if-no-files-found: error
