# ─────────────────────────────────────────────────────────────────────────────
# publish.yml — the seal and the DRAFT release of a gated build. Called by
# release.yml (kind=release) on the archives it just built and by
# republish.yml on another run's, and written ONCE for both: the two copies
# had already diverged once (republish's produced no seal, 2026-07-25).
#
# The crash symbols of the build are published too, as release assets beside the archives and outside the seal and checksums.txt.
#
# The payload refusal was republish's alone; on every publish now: a tag's
# payload never changes, whoever asks.
# ─────────────────────────────────────────────────────────────────────────────
name: publish

on:
  workflow_call:
    inputs:
      build_run_id:
        description: the run whose asset-* and source-commit artifacts to publish
        type: string
        required: true
      tag:
        description: the firefox-N tag (the plan's)
        type: string
        required: true
      num:
        type: string
        required: true
      prevtag:
        type: string
        required: true
      wrapper_ref:
        type: string
        default: main

env:
  # The repository of the series: the release notes are the range between the
  # previous release's series commit and this one.
  SERIES_REPO: ${{ github.repository }}

jobs:
  publish:
    name: publish-draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout wrapper (for scripts/gen_release_notes.py)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          # ⛔ NOT hardcoded to main. The gate validates the BINARY, and the
          # wrapper is only the instrument it is driven with: unfinished work
          # on the wrapper's main must not be able to block a binary release.
          # Default stays main, because main is what gets published next and is
          # therefore the honest pairing - this is an escape hatch, not a
          # change of policy.
          #
          # ⛔ AND THIS IS NOT THE SAME QUESTION AS THE CORE, which is
          # installed from git@main a few steps below and must STAY that way:
          # during a release the published core is one step behind BY
          # CONSTRUCTION, because its version derives from a seal that cannot
          # exist until this binary is built. Pinning the core to the index
          # tests a pairing no user ever gets, and it bit on firefox-20.
          ref: ${{ inputs.wrapper_ref }}
          fetch-depth: 1
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree in _src, the Mozilla tag with our series applied (for scripts/make_seal.py)
        shell: bash
        run: python3 .series/tools/engine.py materialize --into _src
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      # Each archive by the NAME of its artifact, asset-<leg>, the legs of the tree (scripts/ci/legs.py through `scripts/ci matrix`): the API filters a name
      # on the server, while a pattern sees one page of a run's artifacts (run 45278854452: 121 artifacts in the build run, asset-linux-x86_64 on the second
      # page, never downloaded, and the release refused as partial). The assertion below still checks every archive is there.
      - name: Download the build assets, each by its name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          mkdir -p dl
          LEGS="$(python3 _src/scripts/ci matrix | python3 -c 'import json, sys; print(" ".join(i["leg"] for i in json.load(sys.stdin)["include"]))')"
          for leg in $LEGS; do
            id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/artifacts?name=asset-$leg" --jq '[.artifacts[] | select(.expired | not) | .id][0] // empty')"
            [ -n "$id" ] || { echo "ERROR: run $BUILD_RUN has no artifact asset-$leg"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "asset-$leg.zip"
            unzip -o -q "asset-$leg.zip" -d dl
            rm -f "asset-$leg.zip"
            echo "asset-$leg: artifact $id"
          done
      - name: Download source-commit metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-commit
          path: src-meta
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ inputs.build_run_id != github.run_id && github.token || '' }}
      - name: Assert all 3 target archives present (no silent partial release)
        run: |
          # The names the legs build, from the tree (scripts/ci/legs.py), never
          # written here: a port to a new Firefox changes no name by hand.
          EXPECTED="$(python3 _src/scripts/ci assets)"
          cd dl
          for a in $EXPECTED; do
            [ -s "$a" ] || { echo "ERROR: missing/empty release asset: $a (a build leg silently dropped out?)"; exit 1; }
          done
          echo "all 3 target archives present"
      # The crash symbols of the release are kept (release.yml makes them per leg, proves them against the archive it built, and keeps the artifact 30 days
      # on a release): a published build's crash reports are read with them, and until now none survived the artifact. Where they come from is
      # scripts/ci/release_symbols.py's `fetch`: the assets the release already has (a republish of a release that exists does not depend on the artifact's
      # retention; each zip is verified against its symbols.sha256), else the build run's artifact symbols-<leg> BY NAME, like the archives (a pattern sees
      # one page of a run's artifacts). Neither is red, never a skip: a release without its symbols is not published.
      - name: The crash symbols of the release, from its own assets or the build run's artifacts by name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          TAG: ${{ inputs.tag }}
        run: python3 _src/scripts/ci symbols-fetch --tag "$TAG" --repo "$GITHUB_REPOSITORY" --build-run "$BUILD_RUN" --dest symdl
      # The build proved them against its own package; this proves them against the archive that is published (scripts/ci/release_symbols.py), and names each by
      # the BuildID of that archive's application.ini: symbols-<os>-<arch>-<BuildID>.zip, listed in symbols.sha256. They live in sym/, never in dl/: the seal
      # and checksums.txt read dl/, and an engine archive is `firefox-*-stealth-*`.
      - name: The crash symbols describe the archives that ship, named by their BuildID
        shell: bash
        run: |
          set -euo pipefail
          LEGS="$(python3 _src/scripts/ci matrix | python3 -c 'import json, sys; print(" ".join(i["leg"] for i in json.load(sys.stdin)["include"]))')"
          mkdir -p sym
          for leg in $LEGS; do
            python3 _src/scripts/ci symbols-release --leg "$leg" --package "dl/$(python3 _src/scripts/ci asset --leg "$leg")" --symbols "symdl/$leg" --out sym
          done
          python3 _src/scripts/ci symbols-seal --dir sym
          ls -la sym
      - name: Generate checksums.txt
        run: |
          cd dl; ls -la
          # explicit glob — never include checksums.txt itself (the `*`-includes-itself trap)
          sha256sum firefox-*-stealth-* > checksums.txt
          echo "----- checksums.txt -----"; cat checksums.txt
      # The symbols are published beside the archives and are NOT the engine: no symbols name matches the glob above, and checksums.txt lists none.
      - name: No symbols file is an engine archive or in checksums.txt
        run: python3 _src/scripts/ci symbols-guard --dir dl --dir sym --checksums dl/checksums.txt
      # The tag, its number for the title and the previous tag for the changelog
      # range are the caller's plan (scripts/release_plan.py), not derived here.
      - name: Generate + gate seal.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "publishing DRAFT release for tag: $TAG"
          python3 _src/scripts/make_seal.py \
            --tag "$TAG" \
            --assets dl \
            --source-commit-file src-meta/source-commit.txt \
            --series-commit-file src-meta/series-commit.txt \
            --playwright-range _src/browser/config/stealth_playwright_range.txt \
            -o dl/seal.json
          echo "----- seal.json -----"; cat dl/seal.json
      - name: Build release notes from the source commits
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PREVTAG: ${{ inputs.prevtag }}
        run: |
          set -e
          CUR="$(cat src-meta/series-commit.txt 2>/dev/null | tr -d '[:space:]')"
          echo "this build's series commit: ${CUR:-<none>}"
          # previous release's recorded series commit — gives the changelog range.
          # Missing (releases built before the series, firefox-0) -> notes omit the changelog.
          PREV=""
          if [ -n "$PREVTAG" ] && gh release download "$PREVTAG" -R "${{ github.repository }}" \
               --pattern series-commit.txt --dir prev 2>/dev/null; then
            PREV="$(cat prev/series-commit.txt | tr -d '[:space:]')"
            echo "previous ($PREVTAG) series commit: $PREV"
          else
            echo "no previous series-commit.txt — changelog section omitted this time"
          fi
          python scripts/gen_release_notes.py --tag "$TAG" \
            --current "$CUR" --prev-sha "$PREV" --source-repo "${{ env.SERIES_REPO }}" > body.md
          echo "----- generated body.md -----"; cat body.md
          # publish THIS build's commits so the next release can diff from them
          cp src-meta/source-commit.txt dl/source-commit.txt
          cp src-meta/series-commit.txt dl/series-commit.txt
      # A tag's payload never changes (scripts/ci/payload_guard.py). The shell
      # this replaced read every `gh release download` failure as "no seal
      # yet", so a transient GitHub error let a different payload through.
      - name: Refuse a payload change under an existing tag
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ inputs.tag }}"
        run: python3 _src/scripts/ci payload-guard --tag "$TAG" --repo "${{ github.repository }}" --seal dl/seal.json
      - name: The version the tree builds, for the release's title
        id: version
        run: echo "version=$(python3 _src/scripts/ci version)" | tee -a "$GITHUB_OUTPUT"
      - name: Create DRAFT release with all assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          name: firefox_antidetect_patch (${{ steps.version.outputs.version }}) rev ${{ inputs.num }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dl/*.tar.gz
            dl/*.zip
            dl/checksums.txt
            dl/source-commit.txt
            dl/series-commit.txt
            dl/seal.json
            sym/symbols-*.zip
            sym/symbols.sha256
          body_path: body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
