name: noreply-identity
# Pushes series.yml does not see: branches other than main and tags. Pull requests
# and main go through the gate of series.yml.
on:
  push:
    branches-ignore: [main]
    tags: ["**"]
permissions:
  contents: read
jobs:
  noreply-identity:
    # Pinned to a commit of the core (actions pinned by commit SHA: the reusable workflow of another repository is code that runs here).
    uses: oss-invisible/core/.github/workflows/noreply-identity.yml@1baf9479b288a2563010945ca9233c8b1db91202 # core main, the last change of noreply-identity.yml
