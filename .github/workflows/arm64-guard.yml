# SPDX-License-Identifier: 0BSD
# Upstream's workflows stay in the tree byte for byte (tools/engine.py check), and GitHub can
# disable a workflow only once it is registered, which takes its first run. This one disables
# every workflow that is not the fork's own (.github/workflows/arm64*.yml) and cancels their
# queued and running runs: every 20 minutes after release.yml's Monday 03:00 UTC slot, once a
# day for the runs a push to main starts, and on dispatch. No workflow_run trigger: upstream's
# test_release_builder.py allows pull-request events on series.yml only.
name: arm64-guard

on:
  schedule:
    - cron: '*/20 3-6 * * 1'
    - cron: '40 7 * * *'
  workflow_dispatch:

permissions: { actions: write }

concurrency: { group: arm64-guard, cancel-in-progress: false }

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Disable every workflow but the fork's, and cancel their runs
        # A failed API call is a warning, never a red run: the next run tries again.
        run: |
          set -uo pipefail
          own='^\.github/workflows/arm64[^/]*\.ya?ml'
          api() { for _ in 1 2 3; do gh api "$@" && return 0; sleep 10; done; return 1; }
          upstream() { ! [[ "$1" =~ $own ]] && [[ "$1" == .github/workflows/* ]]; }
          if ! workflows="$(api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '.workflows[] | [.id, .state, .path] | @tsv')"; then
            echo "::warning::could not list the workflows"; exit 0
          fi
          while IFS=$'\t' read -r id state path; do
            if ! upstream "$path"; then
              echo "kept      $state $path"
            elif [ "$state" != active ]; then
              echo "already   $state $path"
            elif api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"; then
              echo "disabled  $path"
            else
              echo "::warning::could not disable $path"
            fi
          done <<<"$workflows"
          runs=""
          for st in requested waiting pending queued in_progress; do
            if ! found="$(api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=$st&per_page=100" --jq '.workflow_runs[] | [.id, .path] | @tsv')"; then
              echo "::warning::could not list the $st runs"; continue
            fi
            runs+="$found"$'\n'
          done
          sort -u <<<"$runs" | while IFS=$'\t' read -r id path; do
            if [ -z "$id" ] || ! upstream "$path"; then continue; fi
            if api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null; then
              echo "cancelled run $id ($path)"
            else
              echo "::warning::could not cancel run $id ($path)"
            fi
          done
