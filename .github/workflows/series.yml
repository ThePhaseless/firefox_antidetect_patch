# The engine series on every pull request and every push to main: ONE call of checks.yml, which holds every check that guards main (its
# own rules, the proof that it applies to the Mozilla tag and gives exactly the tree it was exported as, the birth points, the core's checks, the
# noreply identity, and what release.yml used to check before a node). release.yml calls the same file on every candidate: nothing is first
# run on main (docs/decisions/ci-07-every-check-runs-before-the-merge.md). No Firefox build here: release.yml builds it. A check is added to
# checks.yml (written in the source repository, platform/ci/src/.github/workflows/, and exported), never to this file.
name: series
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      wrapper_ref: main

  # The verdict of the workflow: the one check to require. It runs when the checks failed or
  # were skipped, and refuses anything but success.
  gate:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: refuse unless the checks succeeded
        run: |
          echo "checks: ${{ needs.checks.result }}"
          test "${{ needs.checks.result }}" = "success"
