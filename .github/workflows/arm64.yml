# SPDX-License-Identifier: 0BSD
# The fork's linux-arm64 engine at firefox-58: the tree upstream builds, plus arm64/patches,
# built on GitHub's arm64 runner with release.yml's hosted steps, then gated beside
# upstream's own x86 archives (arm64-gate.yml). The build job's steps are copied from
# firefox-58's release.yml and stay upstream's.
name: arm64

on:
  push:
    branches: [arm64, 'arm64-*']
    # A commit that changes no file outside these starts no run (an empty commit neither):
    # dispatch the workflow instead.
    paths-ignore: ['**.md', 'LICENSE', 'arm64/harness/**']
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [candidate, release]
        default: candidate
      release_tag:
        description: 'kind=release only: the fork release to publish, e.g. firefox-58-arm64'
        default: ''
      compile_cache:
        type: choice
        options: ['gha', 'off']
        default: 'gha'
      arm64_run_id:
        description: 'gate only: a candidate run of this workflow, under 7 days old, whose asset-linux-arm64 to gate; the build is skipped'
        default: ''
      core_ref:
        default: 'v58.56.0'
      wrapper_ref:
        default: 'v0.47.1'

concurrency:
  group: ${{ github.event_name == 'push' && format('arm64-push-{0}', github.ref) || format('arm64-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions: { contents: read, actions: read }

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read }
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      tag: ${{ steps.plan.outputs.tag }}
      seal_tag: ${{ steps.plan.outputs.seal_tag }}
      compile_cache: ${{ steps.plan.outputs.compile_cache }}
      gtests: ${{ steps.plan.outputs.gtests }}
      gtest_filter: ${{ steps.plan.outputs.gtest_filter }}
      core_ref: ${{ steps.plan.outputs.core_ref }}
      wrapper_ref: ${{ steps.plan.outputs.wrapper_ref }}
      build_date: ${{ steps.plan.outputs.build_date }}
      matrix: ${{ steps.plan.outputs.matrix }}
      arm64_run_id: ${{ steps.plan.outputs.arm64_run_id }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        run: python3 .series/tools/engine.py materialize --into .
      - name: The fork's overlay
        run: bash .series/arm64/apply.sh .
      - name: The legs
        run: python3 scripts/ci/test_ci.py
      - name: Plan
        id: plan
        shell: bash
        env:
          KIND: ${{ inputs.kind }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPILE_CACHE: ${{ inputs.compile_cache }}
          ARM64_RUN_ID: ${{ inputs.arm64_run_id }}
          CORE_REF: ${{ inputs.core_ref }}
          WRAPPER_REF: ${{ inputs.wrapper_ref }}
        run: |
          set -euo pipefail
          KIND="${KIND:-candidate}"
          if [ "$KIND" = release ] && [ -z "$RELEASE_TAG" ]; then
            echo "ERROR: kind=release needs a release_tag"; exit 1
          fi
          if [ "$KIND" = release ] && [ -n "$ARM64_RUN_ID" ]; then
            echo "ERROR: kind=release publishes this run's own build: arm64_run_id must be empty"; exit 1
          fi
          if ! [[ "$ARM64_RUN_ID" =~ ^[0-9]*$ ]]; then
            echo "ERROR: arm64_run_id is a run id, got '$ARM64_RUN_ID'"; exit 1
          fi
          MATRIX="$(python3 scripts/ci matrix | jq -c '{include: [.include[] | select(.leg=="linux-arm64")]}')"
          jq -e '.include | length == 1' <<<"$MATRIX" >/dev/null || { echo "ERROR: no linux-arm64 leg in the matrix"; exit 1; }
          {
            echo "kind=$KIND"
            echo "tag=$RELEASE_TAG"
            echo "seal_tag=firefox-58"
            echo "compile_cache=${COMPILE_CACHE:-gha}"
            echo "gtests=false"
            echo "gtest_filter="
            echo "core_ref=${CORE_REF:-v58.56.0}"
            echo "wrapper_ref=${WRAPPER_REF:-v0.47.1}"
            echo "build_date=20261108115355"
            echo "arm64_run_id=$ARM64_RUN_ID"
            echo "matrix=$MATRIX"
          } | tee -a "$GITHUB_OUTPUT"

  # WebGPU's Vulkan driver for linux-arm64 (scripts/ci/lavapipe_build.py), as upstream's
  # linux-x86_64 leg builds its own. A job of its own, before the build: LLVM and Mesa cold
  # beside a cold build on a hosted runner's 4 cores would pass the build job's limit. It
  # configures only to get the clang and sysroot the build bootstraps.
  lavapipe:
    name: lavapipe-${{ matrix.leg }}
    needs: [plan]
    if: needs.plan.outputs.arm64_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    permissions: { contents: read }
    env:
      CI_LEG: ${{ matrix.leg }}
      CARGO_HOME: /home/runner/.cargo
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: The runner at the start
        run: |
          { nproc; free -g; df -h; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: apt - network timeouts and retries
        if: runner.environment == 'github-hosted'
        run: |
          printf '%s\n' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' 'Acquire::Retries "5";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
      - name: Free disk
        if: runner.environment == 'github-hosted'
        run: |
          # The build job's cleanup, without its swap: the tree, the toolchain, LLVM and Mesa.
          sudo rm -rf \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / | tail -1
      - name: Python for the series tool
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.splitIndex
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: checkout.workers
          GIT_CONFIG_VALUE_1: '0'
        run: python .series/tools/engine.py materialize --into .
      - name: The fork's overlay
        run: bash .series/arm64/apply.sh .
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install Linux build tools
        if: runner.environment == 'github-hosted'
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux binutils ${{ matrix.extra_pkgs }}
          # lavapipe's, the list scripts/ci/node_bootstrap.sh gives upstream's node
          sudo apt-get install -y cmake ninja-build bison flex patchelf glslang-tools pkg-config
      - name: Rust, the retail's release for this tree
        run: |
          RUST="$(python3 scripts/upstream_toolchain.py --leg ${{ matrix.leg }} rust-version)"
          rustup toolchain install "$RUST" --profile minimal --target ${{ matrix.rust_target }}
          rustup default "$RUST"
          rustc --version
      - name: The CI's .mozconfig, in layers
        run: python3 scripts/ci mozconfig --leg "$CI_LEG" --compile-cache off
      - name: The toolchain the build bootstraps (clang and sysroot)
        timeout-minutes: 60
        run: |
          ./mach configure
          ls ~/.mozbuild
          ~/.mozbuild/clang/bin/clang --version
          test -d ~/.mozbuild/sysroot-aarch64-linux-gnu
      - name: WebGPU's Vulkan driver - its inputs
        id: lavapipe-key
        run: echo "key=lavapipe-${{ matrix.leg }}-$(python3 scripts/ci/lavapipe_build.py --key --clang "$HOME/.mozbuild/clang")" | tee -a "$GITHUB_OUTPUT"
      - name: WebGPU's Vulkan driver - built before
        id: lavapipe-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lavapipe
          key: ${{ steps.lavapipe-key.outputs.key }}
      - name: WebGPU's Vulkan driver - build
        # A library restored under its key is used as it is (lavapipe_build.py's cached()).
        run: |
          python3 scripts/ci/lavapipe_build.py --out "$HOME/.cache/lavapipe" \
            --clang "$HOME/.mozbuild/clang" --sysroot "$HOME/.mozbuild/sysroot-aarch64-linux-gnu" --jobs 4
          cat "$HOME/.cache/lavapipe/VERSION.json"
          readelf -d "$HOME/.cache/lavapipe/libvulkan_lvp.so" | grep -E 'NEEDED|SONAME'
      # From any branch: the key is the library's inputs, and the entry is small.
      - name: WebGPU's Vulkan driver - keep it
        if: steps.lavapipe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lavapipe
          key: ${{ steps.lavapipe-key.outputs.key }}
      - name: Upload the driver
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lavapipe-${{ matrix.leg }}
          path: |
            ~/.cache/lavapipe/libvulkan_lvp.so
            ~/.cache/lavapipe/VERSION.json
          if-no-files-found: error
          retention-days: 7
      - name: The runner at the end
        if: always()
        run: |
          { free -g; df -h /; } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: build-${{ matrix.leg }}
    needs: [plan, lavapipe]
    if: needs.plan.outputs.arm64_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    permissions: { contents: read }
    env:
      MOZ_BUILD_DATE: ${{ needs.plan.outputs.build_date }}
      CI_LEG: ${{ matrix.leg }}
      CARGO_HOME: /home/runner/.cargo
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: The runner at the start
        run: |
          { nproc; free -g; df -h; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: apt - network timeouts and retries
        if: runner.environment == 'github-hosted'
        run: |
          printf '%s\n' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' 'Acquire::Retries "5";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
      - name: Free disk + 32G swap (Linux runners)
        # The node has 800 GB free and 96 GB of memory, and its link fits with no swap.
        if: runner.environment == 'github-hosted'
        run: |
          # The GH-hosted 14GB-free disk is tight for a full Firefox build: objdir
          # (.o + libxul) + `mach package` (a second dist copy) + the archive, plus
          # 16G of swap and, on the win-cross leg, the fetched MSVC toolchain. The
          # first firefox-18 win leg packaged fine and the second died on
          # `No space left on device` at packaging time - i.e. marginal, not broken.
          # Reclaim the big preinstalled caches up front so it stops being marginal.
          # Everything here is best-effort (|| true) - a missing path must never fail
          # the build.
          echo "disk before cleanup:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "disk after cleanup:"; df -h / | tail -1
          # ⛔ The runner image ships its own /swapfile (3 GB, already on), and
          # `fallocate` on it fails with "Text file busy". The `|| true` that was
          # here hid it, every build ran with 3 GB of swap, and the first build
          # with debug symbols was shut down out of memory (run 40441908109:
          # 11.4 of 16 GB used and climbing, then "The runner has received a
          # shutdown signal"). The image's swap goes off first, and fewer than
          # 16 GB fails the step instead of letting the build find out.
          # 24 GB since full LTO (2026-10-27): ld.lld linking libxul.so alone
          # passed 14 GB resident (run 40500378511), on a 16 GB runner. 32 GB
          # since the Windows leg's link used 24.4 of those 24 (run
          # 40520853142), with 56 GB of disk still free at its lowest.
          # Compressed swap in RAM first (2026-10-30). The full-LTO link lives in
          # swap: in run 40965451707 the Windows link held 14.5 GB resident and
          # 24 GB in swap and took 78 min, 55 min on 2026-10-28 for the same link,
          # so the disk under the swap decides. zram (zstd, priority 100) keeps the
          # pages compressed in memory, and reading one back costs CPU, not disk.
          # When it is full the kernel goes on to the swap file (priority 10), on
          # the runner's temporary disk /mnt when it has room, which also leaves /
          # to the objdir. The binary does not change: only where pages wait.
          sudo swapoff -a
          sudo rm -f /swapfile
          # 28G: the Windows link needs ~26 GB of swap and its pages compress ~4:1
          # (run 41013087933: link 45 min, against 57 at 16G and 78 on the disk).
          # A runner whose free device is taken (run 41325666566: "zramctl:
          # /dev/zram0: failed to reset: Device or resource busy") gets a new one
          # from hot_add; one where neither works degrades like a runner without
          # the module, a warning and the disk file alone, never a lost leg.
          zram_swap() {
            ZRAM="$(sudo zramctl --find --size 28G --algorithm zstd)" || {
              N="$(sudo cat /sys/class/zram-control/hot_add)" &&
                sudo zramctl --size 28G --algorithm zstd "/dev/zram$N" && ZRAM="/dev/zram$N"
            } || return 1
            echo 10G | sudo tee "/sys/block/${ZRAM#/dev/}/mem_limit" >/dev/null &&
              sudo mkswap "$ZRAM" >/dev/null && sudo swapon -p 100 "$ZRAM"
          }
          if { sudo modprobe zram 2>/dev/null || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 && sudo modprobe zram; }; } && zram_swap; then
            sudo sysctl -q vm.page-cluster=0
            echo "swap: zram $ZRAM, 28G of pages in at most 10 GB of memory, first" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no usable zram on this runner: the swap is the disk file alone"
            echo "swap: NO usable zram on this runner, the disk file alone" >> "$GITHUB_STEP_SUMMARY"
          fi
          SWAPFILE=/swapfile
          if [ -d /mnt ] && [ "$(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9)" -ge 40 ]; then
            SWAPFILE=/mnt/swapfile
          fi
          sudo fallocate -l 32G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE" >/dev/null
          sudo swapon -p 10 "$SWAPFILE"
          echo "swap file: $SWAPFILE" | tee -a "$GITHUB_STEP_SUMMARY"
          cat /proc/swaps
          FILE_MB="$(awk -v f="$SWAPFILE" '$1==f{print int($3/1024)}' /proc/swaps)"
          [ "${FILE_MB:-0}" -ge 32000 ] || { echo "ERROR: only ${FILE_MB:-0} MB of swap file"; exit 1; }

      - name: Python for the series tool
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        # 497 `git update-index` and 70 `git apply`, each reading and rewriting an index
        # of 400,000 entries. Split, each rewrites only what changed: same objects, same
        # commit, and materialize refuses a tree other than the one UPSTREAM.json declares.
        # The checkout that follows writes its files on every core.
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.splitIndex
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: checkout.workers
          GIT_CONFIG_VALUE_1: '0'
        run: |
          MATERIALIZE="python .series/tools/engine.py materialize --into ."
          # On a node the two legs fetch and apply once, in NODE_SHARED (node_runner.sh).
          [ -z "${NODE_SHARED:-}" ] || MATERIALIZE="$MATERIALIZE --shared $NODE_SHARED"
          if [ "${{ matrix.node }}" = "true" ]; then
            python3 .series/platform/ci/src/scripts/ci/background.py start materialize -- $MATERIALIZE
          else
            $MATERIALIZE
          fi
      - name: The fork's overlay
        run: bash .series/arm64/apply.sh .
      - name: Source commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 781d4239e5ca561104c2fce593cae12972dbcacd
          git rev-parse HEAD > source-commit.txt && cat source-commit.txt
          echo "${{ github.sha }}" > fork-commit.txt && cat fork-commit.txt
      - name: Upload the commits
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commits-${{ matrix.leg }}
          path: |
            source-commit.txt
            fork-commit.txt
          if-no-files-found: error
          retention-days: 7
      - name: Compile cache - restore this leg's last one
        id: cache-restore
        if: needs.plan.outputs.compile_cache == 'gha'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ matrix.leg }}-
      - name: Compile cache - restore again if the first brought nothing
        id: cache-restore-again
        if: needs.plan.outputs.compile_cache == 'gha' && steps.cache-restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ matrix.leg }}-

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }

      - name: Install the invisible_core the page-surface gate asks for its branding
        env:
          CORE_REF: ${{ needs.plan.outputs.core_ref }}
        run: |
          python3 -m pip install --quiet \
            "git+https://github.com/feder-cr/invisible_core@$CORE_REF"
          python3 -c "from importlib.metadata import version; print('core asked for the branding:', version('invisible-core'))"
          ( cd scripts && python3 -c "import validate_release; print('branding it declares:', validate_release.declared_branding())" )

      - name: Install Linux build tools
        if: runner.environment == 'github-hosted'
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux binutils ${{ matrix.extra_pkgs }}

      - name: Rust, the retail's release for this tree
        run: |
          RUST="$(python3 scripts/upstream_toolchain.py --leg ${{ matrix.leg }} rust-version)"
          rustup toolchain install "$RUST" --profile minimal --target ${{ matrix.rust_target }}
          rustup default "$RUST"
          rustc --version

      - name: Compile cache - the sccache binary, if built before
        if: needs.plan.outputs.compile_cache == 'gha'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-bin
          # The node's binary has an entry of its own, even on the same Ubuntu as GitHub's runners. Compile hits do not depend on it: neither sccache's version nor
          # its path enters their key.
          key: sccache-bin-${{ runner.os }}-${{ runner.arch }}${{ runner.environment != 'github-hosted' && '-node' || '' }}-v0.18.0-${{ hashFiles('scripts/ci/sccache/*.patch') }}
      - name: Compile cache - build the one sccache this build uses
        if: needs.plan.outputs.compile_cache == 'gha'
        shell: bash
        run: |
          SCCACHE_PATH="$(python3 scripts/ci sccache-build --tag v0.18.0 --patches scripts/ci/sccache --out "$HOME/.cache/sccache-bin")"
          "$SCCACHE_PATH" --version
          echo "SCCACHE_PATH=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - name: Compile cache - sccache keeps it on the runner's disk
        if: needs.plan.outputs.compile_cache == 'gha'
        run: |
          {
            echo "SCCACHE_DIR=$HOME/.cache/sccache-ci"
            echo "SCCACHE_CACHE_SIZE=30G"
            echo "SCCACHE_PINNED_VERSION=0.18.0"
            # Never idle out: the full-LTO link runs for longer than the default
            # ten minutes with nothing to compile, the server exited, and the
            # statistics step read a fresh server's zeros (run 40593659072).
            echo "SCCACHE_IDLE_TIMEOUT=0"
          } >> "$GITHUB_ENV"
      - name: Compile cache - what this build starts from
        if: needs.plan.outputs.compile_cache == 'gha'
        shell: bash
        env:
          FIRST: ${{ steps.cache-restore.outputs.cache-matched-key }}
          AGAIN: ${{ steps.cache-restore-again.outputs.cache-matched-key }}
        run: |
          FROM="${FIRST:-$AGAIN}"
          # What this build adds is measured against this (scripts/ci/cache_rules.py).
          python3 scripts/ci/cache_rules.py snapshot --dir ~/.cache/sccache-ci --out "$RUNNER_TEMP/sccache-restored.json"
          if [ -n "$FROM" ]; then
            echo "compile cache: ${{ matrix.leg }} restored $FROM; whether it was any use is said after the build, from its hits" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::compile cache: ${{ matrix.leg }} restored nothing and builds cold"
            echo "compile cache: ${{ matrix.leg }} restored NOTHING, this build is cold" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: The CI's .mozconfig, in layers
        env:
          COMPILE_CACHE: ${{ needs.plan.outputs.compile_cache }}
        run: |
          rm -f mozconfig
          if [ "$COMPILE_CACHE" = "gha" ]; then
            test -x "$SCCACHE_PATH" || { echo "ERROR: no sccache at SCCACHE_PATH=$SCCACHE_PATH"; exit 1; }
          fi
          python3 scripts/ci mozconfig --leg "$CI_LEG" --compile-cache "$COMPILE_CACHE"

      - name: Build
        id: build
        env:
          # Windows's link cannot be reached alone, so its whole build asks for huge pages.
          # No configure option reads this (scripts/ci/test_release_path.py).
          GLIBC_TUNABLES: ${{ matrix.node && matrix.family == 'win' && 'glibc.malloc.hugetlb=1' || '' }}
          # Which objects miss, by name: sccache compiles in its clients here (configure's
          # SCCACHE_CLIENT_SIDE without MOZ_AUTOMATION), so the server's debug log never saw a
          # compile and sccache-misses.txt came out empty on every run. The one module that
          # says hit or miss, into this step's log; nothing else of sccache's debug.
          SCCACHE_LOG: ${{ matrix.node && 'sccache::compiler::compiler=debug' || '' }}
        # ⛔ Un tetto sul PASSO, non solo sul job. Il 2026-08-26 la gamba
        # win-x86_64 si e' piantata sul download del toolchain Microsoft che
        # `--enable-bootstrap` fa a inizio build: nessuna riga emessa per oltre
        # tre ore, con il contatore di mach fermo a 0:29. Senza questo tetto la
        # corsa avrebbe consumato le 6 ore del job prima di arrendersi, e il
        # guasto si riconosce solo aprendo il log e notando che il contatore non
        # si muove - cioe' a mano.
        # 180 minuti sono il 48% sopra la piu' lenta build riuscita mai
        # osservata su questa gamba (121 min il 2026-08-26; 105 e 106 il
        # 2026-08-17), quindi non uccide una build lenta ma vera. Quando scatta,
        # il job risulta FALLITO invece che appeso. Si rilancia la corsa intera, che
        # accende un nodo nuovo: `rerun-failed-jobs` non puo' (vedi `rerun-refused`).
        #
        # --keep-going: una corsa che fallisce riporta TUTTI gli errori di
        # compilazione della gamba, non solo i primi. Senza, make si ferma al
        # primo e ogni corsa da 1-2 ore ne mostra uno o due, che e' il modo piu'
        # lento di portare la pila su una versione nuova. Su una build che
        # riesce non cambia niente.
        # The disk too: the Windows leg of run 40466778026 stopped logging after
        # 86 of its 175 minutes with memory at 3 of 16 GB, and the runner never
        # answered again - the pattern of a full disk, which the next run will
        # show or rule out.
        # 300 since PGO + full LTO (2026-10-27): the first Windows leg with
        # them compiled for 156 minutes before its link, cold; the job's own
        # limit (350) stays above it.
        timeout-minutes: 300
        # Memory, swap and disk (memory_watch.py): a leg that runs out of memory goes
        # silent and is terminated without a word (run 40437686466), and these
        # lines are what tells that apart from a hang. The whole output also
        # goes to logs/build.log, uploaded when the build fails: the Windows leg of
        # run 40446702889 failed after its log stream had stopped, and no
        # line of the failure was left to read.
        run: |
          # Sampling every two minutes missed the burst that froze the Windows
          # legs of runs 40446702889 and 40466778026 (3 of 16 GB in the last
          # sample, then nothing): memory_watch.py samples every 5 seconds,
          # names the largest processes when memory runs low, and kills the
          # largest non-runner process before the machine freezes.
          # The phase records its events and, failing, puts its first error
          # lines and the watch's kills in the step summary (scripts/ci/phase.py);
          # its whole output goes to logs/build.log.
          python3 -u scripts/memory_watch.py --log memwatch.log &
          # The libxul link on one group of cores (scripts/ci/link_pin.py), the two legs on
          # the two groups, and the machine's topology and frequency policy in its log. The
          # large L3 to the Windows leg, which usually ends last: on it a link took 13.8 min,
          # on the small one 14.8, both on the node at once (run 41819266470).
          if [ "${{ matrix.node }}" = "true" ]; then
            python3 -u scripts/ci/link_pin.py --mode "${{ matrix.leg == 'win-x86_64' && 'large-l3' || 'small-l3' }}" --log linkpin.log &
          fi
          # The PGO profile is an input and nothing may move it (scripts/ci/input_watch.py):
          # run 40619608072 found its mtime 18 minutes into this step, and cargo
          # rebuilt gkrust for it in the symbols step.
          PROFILE="$HOME/pgo/merged.profdata"
          if [ -f "$PROFILE" ]; then python3 scripts/ci input-watch --file "$PROFILE" --log inputwatch.log & fi
          # On the node the link goes on while the steps below use the machine: this step
          # ends with the compiles, the next ones save, `Build - the link` takes the result.
          if [ "${{ matrix.node }}" = "true" ]; then
            python3 scripts/ci/background.py start build -- python3 scripts/ci phase build -- ./mach build --keep-going
            python3 scripts/ci/background.py until-compiled build
          else
            python3 scripts/ci phase build -- ./mach build --keep-going
            if [ -f "$PROFILE" ]; then python3 scripts/ci input-watch --file "$PROFILE" --log inputwatch.log --verify --strict; fi
          fi
      - name: Compile cache - is this leg's upload worth it
        id: cache-worth
        if: "!cancelled() && needs.plan.outputs.compile_cache == 'gha'"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          "$SCCACHE_PATH" --show-stats > sccache-stats-now.txt || true
          python3 scripts/ci/cache_rules.py worth --stats sccache-stats-now.txt \
            --dir ~/.cache/sccache-ci --restored "$RUNNER_TEMP/sccache-restored.json" | tee -a "$GITHUB_OUTPUT"
      - name: Compile cache - save this leg's
        continue-on-error: true
        # 5 GB at half the measured 5 MB/s. A stalled upload must not hold a finished link.
        timeout-minutes: 35
        # Also when the build failed: the runs that fix a port fail by design,
        # and they are the ones the cache is for.
        # Never when the build did not start: run 40519477694, cancelled during
        # checkout, saved an empty arm64 entry, and the next run would have
        # restored that one - the newest of its leg - and compiled cold.
        # Never on a cancel: GitHub cuts this job 5:00 after it, always() steps included,
        # and the node's upload takes 15. Not starting frees the node at once; an upload
        # that is cut is never committed, and its key holds this run and attempt.
        if: "!cancelled() && needs.plan.outputs.compile_cache == 'gha' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') && steps.cache-worth.outputs.save != 'false' && github.ref == 'refs/heads/arm64'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compile cache - what its key depends on
        if: always() && steps.build.outcome != 'skipped'
        run: python3 scripts/ci/cache_rules.py guard | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Swap - what the build left in zram and in the file
        if: always() && runner.environment == 'github-hosted'
        run: |
          # How much of the link went to zram, how well it compressed, and whether
          # the file was reached: the numbers that say if the compressed swap paid.
          cat /proc/swaps
          sudo zramctl --output-all 2>/dev/null || true
      - name: Upload the logs of a failed build
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildlog-${{ matrix.leg }}
          path: |
            logs/
            memwatch.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Compile cache - the build used the pinned sccache
        if: always() && needs.plan.outputs.compile_cache == 'gha'
        run: |
          "$SCCACHE_PATH" --show-stats | tee sccache-stats.txt || true
          STATS="$(cat sccache-stats.txt)"
          "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
          # configure.py writes the substs as JSON beside config.status.
          CONFIGURED="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["substs"].get("CCACHE", ""))' obj-rel/config.status.json 2>/dev/null || true)"
          echo "configure took CCACHE=${CONFIGURED:-<none>}"
          if [ "$CONFIGURED" != "$SCCACHE_PATH" ]; then
            echo "ERROR: configure did not take SCCACHE_PATH=$SCCACHE_PATH"
            exit 1
          fi
          SERVER="$(echo "$STATS" | sed -n 's/^Version (client) *//p')"
          if [ -n "$SERVER" ] && [ "$SERVER" != "$SCCACHE_PINNED_VERSION" ]; then
            echo "ERROR: the sccache server that compiled is $SERVER, pinned is $SCCACHE_PINNED_VERSION"
            exit 1
          fi
          WRITE_ERRORS="$(echo "$STATS" | sed -n 's/^Cache write errors *//p')"
          if [ "${WRITE_ERRORS:-0}" != "0" ]; then
            echo "::warning::sccache failed to store $WRITE_ERRORS objects: the next run recompiles them"
          fi
      - name: Compile cache - cold or warm, from its hits
        if: always() && needs.plan.outputs.compile_cache == 'gha' && steps.build.outcome != 'skipped'
        run: python3 scripts/ci/cache_rules.py heat --leg "$CI_LEG" --stats sccache-stats.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: WebGPU's Vulkan driver, from the lavapipe job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lavapipe-${{ matrix.leg }}
          path: obj-rel/dist/bin/lavapipe
      - name: WebGPU's Vulkan driver - what is shipped
        run: cat obj-rel/dist/bin/lavapipe/VERSION.json

      - name: Package + validate
        env:
          ASSET: ${{ matrix.asset }}
          # `mach package` compresses a tar.xz nothing reads: the leg ships its own tar.gz
          # of dist/firefox. With PGO its command line says -9e, 192 MiB blocks: too few for
          # threads to matter. xz reads this, and counts 12.3 GiB for it, with the build over.
          XZ_OPT: ${{ matrix.node && '-T16 --block-size=32MiB --memlimit-compress=16GiB' || '' }}
          # '1' runs mach package after stage_package.sh and compares dist/firefox byte for byte.
          # Proved on 04/11: Linux 166 entries (candidate 41913592515), Windows 191 (41917575322).
          CI_PACKAGE_PROVE: ''
        run: python3 scripts/ci phase package -- bash scripts/ci/package_${{ matrix.family }}.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-${{ matrix.leg }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

      - name: Build configuration
        run: |
          set -e
          mkdir -p buildconfig
          python3 - obj-rel/config.status.json buildconfig/build-config-${{ matrix.leg }}.json <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          out = {"substs": status.get("substs", {}), "defines": status.get("defines", {})}
          json.dump(out, open(sys.argv[2], "w"), indent=1, sort_keys=True)
          for key in sorted(out["substs"]):
              if any(t in key for t in ("FLAGS", "OPTIM", "LTO", "PGO", "RUST", "CC_VERSION", "CXX_VERSION")) or key in ("CC", "CXX", "LINKER_KIND"):
                  print("%s = %s" % (key, out["substs"][key]))
          PY
      - name: Upload build configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildconfig-${{ matrix.leg }}
          path: buildconfig/*.json
          if-no-files-found: error
          retention-days: 90
      - name: The runner at the end
        if: always()
        run: |
          { nproc; free -g; df -h; } | tee -a "$GITHUB_STEP_SUMMARY"

  gate:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.plan.outputs.arm64_run_id != ''))
    permissions: { contents: read, actions: read }
    uses: ./.github/workflows/arm64-gate.yml
    with:
      upstream_tag: ${{ needs.plan.outputs.seal_tag }}
      arm64_run_id: ${{ needs.plan.outputs.arm64_run_id || github.run_id }}
      wrapper_ref: ${{ needs.plan.outputs.wrapper_ref }}
      core_ref: ${{ needs.plan.outputs.core_ref }}

  # kind=release: the fork release, this run's arm64 archive with a seal that is upstream's
  # firefox-58 seal plus the arm64 entry. Only after the gate, the host gate and the leaf
  # diff are green.
  publish:
    needs: [plan, build, gate]
    if: needs.plan.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: write, actions: read }
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      SEAL_TAG: ${{ needs.plan.outputs.seal_tag }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree in _src, the Mozilla tag with our series applied (for scripts/make_seal.py)
        shell: bash
        run: python3 .series/tools/engine.py materialize --into _src
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: This run's asset-linux-arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: asset-linux-arm64, path: run }
      - name: This run's commits-linux-arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: commits-linux-arm64, path: run }
      - name: This run's host-gate-report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: host-gate-report, path: run }
      - name: This run's leaf-diff-report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: leaf-diff-report, path: run }
      - name: Upstream's release of the tag
        run: |
          gh release download "$SEAL_TAG" -R oss-invisible/firefox_antidetect_patch -D up \
            -p seal.json -p source-commit.txt -p series-commit.txt \
            -p '*-linux-x86_64.tar.gz' -p '*-win-x86_64.zip'
          ls -la run up
      - name: Every file of this run is there, and the build is of upstream's source commit
        run: |
          set -euo pipefail
          for f in firefox-159.0-stealth-linux-arm64.tar.gz source-commit.txt fork-commit.txt host-gate.txt exceptions.diff leaf-diff.txt; do
            [ -s "run/$f" ] || { echo "ERROR: run/$f missing or empty"; exit 1; }
          done
          [ "$(cat run/fork-commit.txt)" = "$GITHUB_SHA" ] || { echo "ERROR: fork-commit.txt is not this run's commit"; exit 1; }
          cmp run/source-commit.txt up/source-commit.txt
      - name: The seal, by upstream's make_seal.py, and equal to upstream's but for the arm64 entry
        run: |
          set -euo pipefail
          mkdir dl
          cp up/*-linux-x86_64.tar.gz up/*-win-x86_64.zip run/firefox-159.0-stealth-linux-arm64.tar.gz dl/
          python3 _src/scripts/make_seal.py --tag "$SEAL_TAG" --assets dl \
            --source-commit-file up/source-commit.txt --series-commit-file up/series-commit.txt \
            --playwright-range _src/browser/config/stealth_playwright_range.txt \
            -o seal.json
          cat seal.json
          python3 -I - <<'PY'
          import json, sys
          ours, theirs = (json.load(open(p)) for p in ("seal.json", "up/seal.json"))
          arm = "firefox-159.0-stealth-linux-arm64.tar.gz"
          extra = sorted(set(ours["assets"]) - set(theirs["assets"]))
          if extra != [arm]:
              sys.exit("seal: extra assets %r, expected only %s" % (extra, arm))
          entry = ours["assets"].pop(arm)
          if json.dumps(ours, sort_keys=True) != json.dumps(theirs, sort_keys=True):
              sys.exit("seal: differs from upstream's beyond the arm64 entry")
          if (entry["platform"], entry["arch"]) != ("linux", "arm64"):
              sys.exit("seal: the arm64 entry is %r" % entry)
          print("seal: upstream's %s seal plus %s" % (theirs["tag"], arm))
          PY
      - name: Publish the release
        run: |
          set -euo pipefail
          mkdir rel
          cp run/firefox-159.0-stealth-linux-arm64.tar.gz run/fork-commit.txt run/source-commit.txt \
            run/host-gate.txt run/leaf-diff.txt run/exceptions.diff up/series-commit.txt seal.json rel/
          (cd rel && sha256sum -- * > checksums.txt && cat checksums.txt)
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf 'linux-arm64 engine for upstream tag %s (oss-invisible/firefox_antidetect_patch), built and gated in %s.\nSee README.md for what it covers.\n' \
            "$SEAL_TAG" "$RUN_URL" > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md rel/*
